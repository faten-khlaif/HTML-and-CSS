<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faten Khlaif - Student Website</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      /* Apply custom body typography */
      font-family: 'Inter', sans-serif;
      margin: 0;
      background-color: #f0f4f8;
      color: #333;
    }
    nav {
      background-color: #2c3e50;
      padding: 10px;
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 1000; /* Ensures navigation stays on top of scaling images */
    }
    nav a {
      color: #ecf0f1;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }
    section {
      padding: 60px 20px;
      margin-top: 50px;
    }
    h1, h2 {
      /* Apply custom heading typography */
      font-family: 'Poppins', sans-serif;
      color: #2c3e50;
    }
    
    /* Image setup with transition for smooth animations */
    img {
      max-width: 200px;
      margin: 10px;
      border-radius: 8px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
    }

    /* 2. Customize Image Hover Effects */
    img:hover {
      transform: scale(1.08) rotate(2deg); /* Scales up slightly and adds a subtle tilt */
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15); /* Adds a soft drop shadow depth */
      filter: brightness(1.1); /* Slightly brightens the image on hover */
      cursor: pointer;
    }

    form {
      display: flex;
      flex-direction: column;
      max-width: 400px;
    }
    input, textarea {
      font-family: inherit; /* Ensures input fields use the new Inter font */
      margin: 8px 0;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      font-family: inherit;
      background-color: #3498db;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    footer {
      background-color: #2c3e50;
      color: #ecf0f1;
      text-align: center;
      padding: 15px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#pictures">Pictures</a>
    <a href="#video">Video</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="home">
    <h1>Welcome to Faten Khlaif’s Website</h1>
    <p>Hello! My name is Faten Khlaif. This is my personal student webpage showcasing my work, interests, and ways to connect with me.</p>
  </section>

  <section id="pictures">
    <h2>Gallery</h2>
    <img src="https://via.placeholder.com/200" alt="Sample Picture 1">
    <img src="https://via.placeholder.com/200" alt="Sample Picture 2">
    <img src="https://via.placeholder.com/200" alt="Sample Picture 3">
  </section>

  <section id="video">
    <h2>Featured Video</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
      title="YouTube video" frameborder="0" allowfullscreen></iframe>
  </section>

  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="5" placeholder="Your Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 Faten Khlaif. All rights reserved.</p>
  </footer>

</body>
</html>
